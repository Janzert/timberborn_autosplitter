[package]
name = "test-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test harness for the Timberborn auto splitter: fake memory and a fake auto splitting runtime, so the splitter can be driven without the game"

# Deliberately no dependency on `timberborn_autosplitter`. The splitter
# dev-depends on this crate, so the arrow only points one way; a test owns both
# and hands the splitter's future to `drive`.
[dependencies]
# For fixtures/*.json: the committed facts a synthetic world is built from.
# Reading it by hand is a tokeniser and an escape table nobody should own, and
# this crate is dev-only -- it is never built for wasm and never ships. The
# schema itself is still hand-mapped in `fixture`, so a malformed fixture fails
# with the field it stumbled on rather than a serde path.
serde_json = "1.0.151"

# Only for SIGSTOP/SIGCONT and the signal handlers that undo them; everything
# else here is std. Dev-only, and never built for wasm.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# A fixture for the descriptor-passing tests: the same protocol as
# tb-ptrace-open, without the privilege. Nothing ships it.
[[bin]]
name = "fd-source"
path = "src/bin/fd-source.rs"

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Only used by the release step, which runs on tags.
      contents: write

    steps:
      # The auto splitter builds against a fork of asr carried as a submodule,
      # so a shallow checkout without it cannot compile.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # rust-toolchain pins stable. The wasm target is not the default -- see
      # .cargo/config.toml -- but it is what ships, so it has to be installed.
      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown

      # `cargo wasm` is the alias for the shipped artifact. A plain
      # `cargo build` now targets the host, which is right for the tests and
      # wrong for the thing being released.
      - name: Build
        run: cargo wasm

      - name: Clippy
        run: cargo clippy --release --target wasm32-unknown-unknown -- -D warnings

      # Runs on the host with no game and no wasm: test-harness/ stands in for
      # the auto splitting runtime. Tests that need a captured snapshot are
      # behind the snapshot-tests feature and deliberately not run here --
      # there is no game on a CI runner to capture one from.
      - name: Test
        run: cargo test --workspace

      - name: Clippy (tests)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --all -- --check

      # Printed so a downloaded artifact can be checked against the build it
      # claims to come from.
      - name: Checksum
        run: sha256sum target/wasm32-unknown-unknown/release/timberborn_autosplitter.wasm

      - uses: actions/upload-artifact@v7
        with:
          name: timberborn_autosplitter
          path: target/wasm32-unknown-unknown/release/timberborn_autosplitter.wasm
          if-no-files-found: error

      # On a tag, attach the build to its release, creating the release if it
      # does not exist yet. --clobber so re-running a tag replaces the asset
      # rather than failing.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            target/wasm32-unknown-unknown/release/timberborn_autosplitter.wasm \
            examples/Timberborn-Wonder-Folktails.lss \
            examples/Timberborn-Wonder-IronTeeth.lss \
            examples/Timberborn.lsl --clobber

# The harness is a workspace member as well as a dev-dependency, so its dumper
# binary can be built by name. `cargo build` in this directory still builds only
# this package, and only as an `rlib`: the artifact that ships is `cargo wasm`.
[workspace]
members = ["test-harness", "tb-fixture", "tb-ptrace-open", "tb-record"]

[package]
name = "timberborn_autosplitter"
version = "0.4.0"
edition = "2021"
description = "LiveSplit auto splitter for Timberborn, reading the game's memory rather than running a mod"
license = "MIT"
repository = "https://github.com/Janzert/timberborn_autosplitter"

[dependencies]
asr = { git = "https://github.com/LiveSplit/asr", features = [
    "alloc",  # Working with allocations.
    "flags",  # MemoryRangeFlags, for filtering ranges during the heap scan.
    "derive", # Defining settings structs and binding to .NET classes.
    "unity",  # Accessing games using the Unity engine (implies "signature").
] }

# Bytemuck is used to define structs that are read from the game's process.
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
# Heap allocator.
dlmalloc = { version = "0.2.4", features = ["global"] }

# Redirect the upstream asr dependency to our submodule, so local changes are
# picked up and the exact revision is pinned by the submodule gitlink.
# Drop this stanza once the changes we need land upstream.
[patch."https://github.com/LiveSplit/asr"]
asr = { path = "vendor/asr" }

# The test harness: a fake auto splitting runtime. A dev-dependency, so it is
# never built for wasm and the shipped artifact cannot depend on it.
[dev-dependencies]
test-harness = { path = "test-harness" }
# The synthetic-world tests ask asr directly whether it can attach to what the
# builder wrote, rather than inferring it from the splitter's behaviour. That
# question has to be put to asr itself, so asr is a dev-dependency as well as a
# dependency; the `[patch]` above redirects both to the submodule.
asr = { git = "https://github.com/LiveSplit/asr", features = [
    "alloc",
    "flags",
    "unity",
] }

[features]
# Tests that need a memory snapshot of a real game. Gated rather than skipped:
# a test that silently does nothing reports green for work it did not do. See
# snapshots/README.md.
snapshot-tests = []

# Kept out of the default test run by the feature above, so `cargo test`
# neither compiles nor counts it.
[[test]]
name = "snapshot_attach"
required-features = ["snapshot-tests"]

[[test]]
name = "snapshot_run"
required-features = ["snapshot-tests"]

[[test]]
name = "snapshot_first_bot"
required-features = ["snapshot-tests"]

[[test]]
name = "scenario_run"
required-features = ["snapshot-tests"]

[[test]]
name = "fixture_vs_snapshot"
required-features = ["snapshot-tests"]

[lib]
# The wasm module is what this crate is for, but it is not declared here: Cargo
# cannot choose a crate type by target, and a `cdylib` declared here is built
# for the host too. That host DLL leaves asr's runtime imports undefined, which
# a Linux shared object tolerates and an MSVC DLL does not, so on Windows it
# failed to link before any test ran. So `cargo wasm` asks for the `cdylib`
# itself -- it is `cargo rustc --crate-type cdylib` -- and every other build,
# the tests' included, gets the `rlib` they link against.
#
# Keep the `cdylib` build `cdylib` only. An `rlib` cannot be LTO'd, and when a
# crate is built as both, Cargo silently drops `lto` from the whole build: no
# `-C lto` for this crate, no `-C linker-plugin-lto` for its dependencies, and
# no warning. Every release up to 0.4 shipped that way, and asking for both is
# how it would come back.
crate-type = ["rlib"]

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true

[profile.release.build-override]
opt-level = 0
